<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live demo of the examwatch-js NPM package" />
    <title>ExamWatch JS Demo</title>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">examwatch-js live demo</p>
        <h1>Exam activity monitor</h1>
        <p>Try copy/paste, switch tabs, lose window focus, or leave fullscreen.</p>
      </header>

      <section class="controls" aria-label="Demo controls">
        <button id="start" type="button">Start monitoring</button>
        <button id="fullscreen" type="button" class="secondary">Enter fullscreen</button>
        <button id="reset" type="button" class="secondary">Reset</button>
      </section>

      <section class="grid">
        <article class="card">
          <div class="card-heading">
            <h2>Status</h2>
            <span id="status" class="badge">Stopped</span>
          </div>
          <dl class="stats">
            <div><dt>Violations</dt><dd id="violations">0</dd></div>
            <div><dt>Total events</dt><dd id="total">0</dd></div>
          </dl>
        </article>

        <article class="card">
          <h2>Event log</h2>
          <ol id="events" class="events">
            <li class="empty">Start monitoring to see events.</li>
          </ol>
        </article>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
